buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.flywaydb:flyway-database-postgresql:13.2.0")
  }
}


plugins {
  id 'scala'
  id 'application'
  id 'jvm-test-suite'
  id 'checkstyle'
  id 'pmd'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.flywaydb.flyway' version '13.2.0'
  id 'org.springframework.boot' version '3.5.16'
  id 'org.owasp.dependencycheck' version '12.2.2'
  id 'com.github.ben-manes.versions' version '0.59.0'
  id 'org.sonarqube' version '7.3.1.8318'
  id 'io.gatling.gradle' version '3.15.1.2'
}

group = 'uk.gov.hmcts.reform'
version = '0.0.1'

pmd {
  toolVersion = "6.55.0"
  reportsDir = layout.buildDirectory.dir("reports/pmd").get().asFile
  ruleSetFiles = files("config/pmd/ruleset.xml")
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

checkstyle {
  toolVersion = '13.9.0'
  configFile = new File(rootDir, "checkstyle.xml")
  maxWarnings = 0
}

ext {
  lombokVersion = '1.18.46'
}

testing {
  suites {
    configureEach {
      useJUnitJupiter()

      dependencies {
        implementation 'io.rest-assured:rest-assured'
        implementation 'org.slf4j:slf4j-api'
      }
    }

    withType(JvmTestSuite).matching { it.name in ['smoke', 'functional'] }.configureEach {
      sources {
        java {
          srcDirs = ['src/functional/java']
        }
      }
    }

    smoke(JvmTestSuite) {
      dependencies {
        implementation project()
      }

      targets {
        all {
          testTask.configure {
            options {
              includeTags 'SmokeTest'
            }
          }
        }
      }
    }

    functional(JvmTestSuite) {
      dependencies {
        implementation project()
      }
    }
  }
}

// https://jeremylong.github.io/DependencyCheck/dependency-check-gradle/configuration.html
dependencyCheck {
  // Specifies if the build should be failed if a CVSS score above a specified level is identified.
  // range of 0-10 fails the build, anything greater and it doesn't fail the build
  failBuildOnCVSS = System.getProperty('dependencyCheck.failBuild') == 'true' ? 0 : 11
  suppressionFile = 'dependency-check-suppressions.xml'
  analyzers {
    // Disable scanning of .NET related binaries
    assemblyEnabled = false
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1' }
}

dependencyManagement {
    // Ensure TestContainers versions 1.21.4 are used instead of 1.19.7 set by Spring Boot
    imports {
      mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }

    dependencies {

        //CVE-2022-25857, CVE-2022-38749, CVE-2022-38750, CVE-2022-38751, CVE-2022-38752, CVE-2022-41854
        dependencySet(group: 'org.yaml', version: '2.6') {
            entry 'snakeyaml'
        }
    }
}

jacocoTestReport {
  executionData(test)
  reports {
    xml.required = true
    csv.required = false
    html.required = true
  }
}

tasks.named('sonarqube') {
  dependsOn jacocoTestReport
}

tasks.named('sonar') {
  dependsOn jacocoTestReport
}

sonarqube {
  properties {
    property "sonar.projectName", "sds-toffee-recipes-service"
    property "sonar.projectKey", "sds-toffee-recipes-service"
    property "sonar.dependencyCheck.reportPath", "${layout.buildDirectory.get().asFile}/reports/dependency-check-report.xml"
    property "sonar.coverage.exclusions", "**/config/**, **Exception**"
  }
}

dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

/* Spring Boot and Gatling clash on the Netty dependency and the Gradle resolution picks the Spring Boot's 4.1.109.Final 
   Gradle requires 4.2.1.Final for the tests to run, so we need to force it to use that version for the Gatling tests 
   With the exception of netty-tcnative which does not have a 4.2.1.Final version
   https://community.gatling.io/t/java-lang-noclassdeffounderror-io-netty-channel-iohandle/9672
   */
configurations.matching { it.name.toLowerCase().contains('gatling') }.all {
  resolutionStrategy {
    eachDependency { DependencyResolveDetails details ->
      if (details.requested.group == 'io.netty' && !details.requested.name.startsWith('netty-tcnative')) {
        details.useVersion '4.2.1.Final'
      }
    }
  }
}

dependencies {
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aop'
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-jdbc'
  implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.13'

  implementation group: 'org.flywaydb', name: 'flyway-core', version: '13.2.0'
  implementation group: 'org.flywaydb', name: 'flyway-database-postgresql', version: '13.2.0'

  implementation group: 'com.google.guava', name: 'guava', version: '33.6.0-jre'

  implementation group: 'com.github.hmcts.java-logging', name: 'logging', version: '8.0.0'
  implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.9.0'

  compileOnly group: 'org.projectlombok', name: 'lombok', version: lombokVersion
  annotationProcessor group: 'org.projectlombok', name: 'lombok', version: lombokVersion

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }
  testImplementation group: 'com.typesafe', name: 'config', version: '1.4.4'

  testImplementation "org.testcontainers:junit-jupiter"
  testImplementation "org.testcontainers:postgresql"
}

application {
  mainClass.set('uk.gov.hmcts.reform.rhubarb.recipes.Application')
}

bootJar {
  archiveFileName = 'sds-toffee-recipes-service.jar'

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }
}

sourceSets {
  functional {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functional/java')
    }
    resources.srcDir file('src/functional/resources')
  }
}

task highLevelDataSetup {
}

wrapper {
  distributionType = Wrapper.DistributionType.ALL
}
